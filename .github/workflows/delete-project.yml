name: delete-project

# Removes a project new-project made: the org repo, the Worker (with its Workers Builds
# connection), D1 `<name>` and `<name>-preview`, the shared build token once no other Worker uses
# it, and a leftover branch `new/<name>` here. Run workflow only (Actions page, the PC, or a thread's
# run_workflow), never a push. `confirm` must repeat the name, and a repo without new-project's
# description is refused, so real repos can't go this way (publish skill, §Delete a project).
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Project name (repo and Worker)'
        required: true
        type: string
      confirm:
        description: 'Type the name again to confirm'
        required: true
        type: string
      org:
        description: 'GitHub org that owns the repo'
        required: false
        type: string
        default: yverse-studio

permissions:
  contents: read

concurrency:
  group: project-${{ inputs.name }}

jobs:
  delete:
    if: inputs.confirm == inputs.name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/delete-project.test.mjs
      - run: node scripts/delete-project.mjs
        env:
          NAME: ${{ inputs.name }}
          CONFIRM: ${{ inputs.confirm }}
          ORG: ${{ inputs.org }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECTS_GITHUB_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}

  branch:
    # Only this job may write here, and it runs no repo code.
    needs: delete
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/new/$NAME" || echo "no branch new/$NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
