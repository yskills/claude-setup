name: new-project-request

# The unprivileged half: a cloud thread pushes a branch `new/<name>` (with `projects/<name>.json`)
# and this run, with no secrets and no permissions, is the signal. When it completes, new-project.yml
# runs on `workflow_run`, which always uses the workflow file and the code of `main`: a pushed
# branch can only supply the json, never the code that runs with the keys.
on:
  push:
    branches: ['new/**']

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "new project requested from $GITHUB_REF_NAME ($GITHUB_SHA)"
