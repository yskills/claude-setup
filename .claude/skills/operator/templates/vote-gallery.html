<title>Designwahl</title>
<!-- Vote gallery (roles/designer.md, Vote gallery). Change only the title and the array D: one entry per option, k = letter, nm = name, f = the draft file next to this page, t = one line, rec/why on the recommendation. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: a slim control dock on top, the live shop fills the rest. Desktop or phone frame, one tap to choose. */
:root{
  --bg:#EEEDE8;--surface:#FFFFFF;--fg:#1D201C;--muted:#62665E;--line:#D9D8D0;
  --accent:#3F4A2E;--on-accent:#FFFFFF;--rec:#8A5A12;--rec-soft:#F6E9CF;--ok:#2F6B3F;--ok-soft:#DDEEDF;
  --stage:#D9D8D1;
  --ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171916;--surface:#22251F;--fg:#ECEDE6;--muted:#A3A79C;--line:#353930;
  --accent:#B9C99A;--on-accent:#171916;--rec:#E8B866;--rec-soft:#3A2F1C;--ok:#8FD3A0;--ok-soft:#1F3325;--stage:#0F110E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171916;--surface:#22251F;--fg:#ECEDE6;--muted:#A3A79C;--line:#353930;
  --accent:#B9C99A;--on-accent:#171916;--rec:#E8B866;--rec-soft:#3A2F1C;--ok:#8FD3A0;--ok-soft:#1F3325;--stage:#0F110E;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

.dock{background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;border:0;background:none;border-radius:9px;padding:8px 14px;min-height:40px;display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted)}
.tab b{font-weight:700;color:var(--fg)}
.tab:hover{background:var(--bg)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] b{color:var(--on-accent)}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 7px;line-height:1.4}
.tag.rec{background:var(--rec-soft);color:var(--rec)}
.tag.mine{background:var(--ok-soft);color:var(--ok)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:8px 12px;min-height:40px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg svg,.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.choose{flex:none;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 18px;min-height:44px;display:flex;align-items:center;gap:8px}
.choose[data-done="true"]{background:var(--ok-soft);color:var(--ok)}
.nav{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav:hover{border-color:var(--accent)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;min-width:34px;text-align:center}
.desc{min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.desc strong{font-size:17px;font-weight:700}
.desc span{color:var(--muted)}
.why{color:var(--rec);font-weight:500}
.hint{color:var(--muted);font-size:13px;flex:none}
.status{font-size:13px;color:var(--muted);flex:none}

.stage{position:relative;background:var(--stage);overflow:hidden;display:grid;place-items:center}
.frames{position:absolute;inset:0;display:grid;place-items:center}
.frames iframe{position:absolute;border:0;background:#fff;inset:0;width:100%;height:100%}
.stage.phone .frames iframe{inset:auto;width:390px;height:min(844px,calc(100% - 32px));max-width:calc(100% - 32px);border-radius:36px;box-shadow:0 0 0 10px #111,0 24px 60px -20px rgba(0,0,0,.5)}
.loading{position:absolute;color:var(--muted)}
@media (max-width:820px){
  .hint,.seg,.status{display:none}
  .dock{padding:8px 12px}
  .tab{padding:8px 10px}
  .tab .nm,.full{display:none}
  .tabs{flex:1;justify-content:space-between}
  .row:first-child .spacer{display:none}
  .choose{padding:0 14px}
  .desc span{display:none}
  .desc .why{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="dock">
    <div class="row">
      <div class="tabs" role="tablist" id="tabs" aria-label="Designs"></div>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="vDesk" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Desktop</button>
        <button id="vPhone" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Handy</button>
      </div>
      <button class="choose" id="choose">Dieses Design wählen</button>
    </div>
    <div class="row">
      <button class="nav" id="prev" aria-label="Vorheriges Design"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="count" aria-live="polite" id="count">1/5</span>
      <button class="nav" id="next" aria-label="Nächstes Design"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="desc"><strong id="dName"></strong><span id="dText"></span><em class="why" id="dWhy"></em></div>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
      <span class="hint">Pfeiltasten ← → wechseln · alles im Shop ist klickbar</span>
    </div>
  </header>
  <main class="stage" id="stage"><div class="frames" id="frames"><span class="loading">Shop lädt …</span></div></main>
</div>

<script>
const D = [
  {k:"A", nm:"Galerie", f:"a-galerie.html", t:"Ruhig und edel wie HAY, mit großen Fotos und feiner Serifenschrift."},
  {k:"B", nm:"Wohnlich", f:"b-wohnlich.html", rec:true, t:"Warm wie Westwing, mit großem Wohnzimmerfoto und Suche im Mittelpunkt.",
   why:"Empfehlung: Suche gleich im Bild, Deals mit klarer Rangfolge, verkauft am besten."},
  {k:"C", nm:"Kräftig", f:"c-kraeftig.html", t:"Laut, mit fetter Schrift in Gelb und Blau, eher im Discounter-Look."},
  {k:"D", nm:"Kuschelig", f:"d-kuschelig.html", t:"Rund und pastellig, mit verspielten Formen."},
  {k:"E", nm:"Retro", f:"e-retro.html", t:"70er-Look mit Bogen und Streifen und viel Charakter."}
];
const $ = id => document.getElementById(id);
const frames = {};
let cur = 1, chosen = null, phone = false, db = null, uid = null;
try { const h = location.hash.slice(1).toUpperCase(); const i = D.findIndex(d => d.k === h); if (i >= 0) cur = i; } catch {}

function frame(i) {
  if (frames[i]) return frames[i];
  const f = document.createElement("iframe");
  f.title = "Design " + D[i].k + " " + D[i].nm;
  f.src = D[i].f;
  f.hidden = true;
  f.addEventListener("load", () => {
    try { f.contentWindow.addEventListener("keydown", onKey); } catch {}
    $("frames").querySelector(".loading")?.remove();
  });
  $("frames").appendChild(f);
  return frames[i] = f;
}

function render() {
  $("tabs").innerHTML = D.map((d, i) =>
    `<button class="tab" role="tab" aria-selected="${i === cur}" data-i="${i}"><b>${d.k}</b><span class="nm">${d.nm}</span>` +
    (d.rec ? `<span class="tag rec">★<span class="full"> Empfehlung</span></span>` : "") +
    (chosen === d.k ? `<span class="tag mine">Gewählt</span>` : "") + `</button>`).join("");
  const d = D[cur];
  $("count").textContent = (cur + 1) + "/" + D.length;
  $("dName").textContent = d.k + " · " + d.nm;
  $("dText").textContent = d.t;
  $("dWhy").textContent = d.why || "";
  const btn = $("choose");
  btn.dataset.done = chosen === d.k;
  btn.innerHTML = chosen === d.k ? "✓ " + d.k + " gewählt" : '<span class="full">Design </span>' + d.k + " wählen";
  Object.entries(frames).forEach(([i, f]) => f.hidden = +i !== cur);
  frame(cur).hidden = false;
  $("stage").classList.toggle("phone", phone);
  $("vDesk").setAttribute("aria-pressed", !phone);
  $("vPhone").setAttribute("aria-pressed", phone);
}

function go(i) { cur = (i + D.length) % D.length; render(); }
function onKey(e) {
  const t = e.target, tag = t && t.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
}
addEventListener("keydown", onKey);
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(+b.dataset.i); });
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("vDesk").onclick = () => { phone = false; render(); };
$("vPhone").onclick = () => { phone = true; render(); };

$("choose").onclick = async () => {
  const d = D[cur];
  chosen = d.k; render();
  if (!db || !uid) { $("status").textContent = "Nicht gespeichert: schreib „" + d.k + "“ in den Projekt-Chat."; return; }
  $("status").textContent = "Speichere …";
  try {
    await db.doc("wahl/" + uid).set({design: d.k, name: d.nm, at: new Date().toISOString()});
    $("status").textContent = "Gespeichert, Claude sieht deine Wahl " + d.k + ".";
  } catch (err) {
    $("status").textContent = "Nicht gespeichert: schreib „" + d.k + "“ in den Projekt-Chat.";
  }
};

render();
// Lade die übrigen Shops leise vor, damit der Wechsel sofort geht.
setTimeout(() => D.forEach((_, i) => frame(i)), 1500);

(async () => {
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const snap = await db.doc("wahl/" + uid).get();
    if (snap.exists) { chosen = snap.data().design; $("status").textContent = "Deine Wahl ist gespeichert: " + chosen + "."; render(); }
  } catch {}
})();
</script>
