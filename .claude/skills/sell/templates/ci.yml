# Goes to .github/workflows/ci.yml. Verify on every PR, upload a preview link per PR, deploy
# from main only. The shop's keys are secrets of the GitHub environment "production", whose
# deployment-branch rule allows main only, so no PR branch can read them (keys.md). Repo-level
# secrets are only CLOUDFLARE_ACCOUNT_ID and PREVIEW_CLOUDFLARE_API_TOKEN.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-run a deploy from main, e.g. after adding or swapping a key.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a running deploy on main; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Stripe's official API mock: the e2e tests create real Checkout Sessions against it.
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    env:
      STRIPE_MOCK: http://127.0.0.1:12111
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  # A preview link on every PR, so yskills can click through before merging. Previews are
  # versions of a separate Worker, <name>-preview (env.preview in wrangler.jsonc), which every main
  # deploy updates. It has its own empty D1 and no shop keys, so PR code never touches live data.
  # This job builds and runs PR code, so it gets only PREVIEW_CLOUDFLARE_API_TOKEN (Workers Editor
  # on the preview Worker alone) and no GitHub write access; a separate job posts the link.
  # Without that secret it posts a notice instead. A same-repo PR that edits this file runs its
  # edit with every repo-level secret, which is why the live keys sit in the "production"
  # environment and only CLOUDFLARE_ACCOUNT_ID and the preview token are repo secrets (keys.md).
  # Bindings are not inherited by env.preview, so it repeats the allowed ones; a D1 binding there has
  # neither database_name nor database_id: deploy.mjs fills them in at deploy time and a PR upload
  # inherits the binding. Only D1 and ratelimits are allowed: a KV, R2, queue, Hyperdrive or
  # service binding names its resource in the PR's own config, which could point at live data.
  # A project that needs one gives the preview its own resource in deploy.mjs --preview first. wrangler.jsonc (plain JSON, no comments):
  #   "env": { "preview": { "name": "shop-preview", "preview_urls": true,
  #     "d1_databases": [{ "binding": "DB", "migrations_dir": "server/migrations" }] } }
  # Old pr-<n> aliases stay up after a PR closes; with no data and no keys behind them that is
  # harmless.
  preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      HAS_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No preview link yet. Add the repo secret PREVIEW_CLOUDFLARE_API_TOKEN (keys.md says how)."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci --ignore-scripts
      - if: env.HAS_TOKEN == 'true'
        run: npm run build
      - name: Upload preview
        id: upload
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          # Catches an accidental config change; the token's scope is what actually limits this job.
          jq -e '.env.preview | (keys - ["name", "preview_urls", "ratelimits", "d1_databases"] | length == 0)
            and ((.d1_databases // []) | all(keys - ["binding", "migrations_dir"] | length == 0))' wrangler.jsonc > /dev/null || {
            echo "::error::env.preview in wrangler.jsonc may only hold name, preview_urls, ratelimits and a DB binding without a database name or id."
            exit 1
          }
          # --name pins the upload to the preview Worker whatever the PR's config says. Renaming the
          # Worker: change shop-preview here, in preview-comment's regex and WORKER in deploy.mjs.
          if ! out=$(npx wrangler versions upload --env preview --name shop-preview --preview-alias "pr-$PR" 2>&1); then
            echo "$out"
            if grep -q "does not yet exist" <<<"$out"; then
              echo "::notice::No preview yet: the next deploy from main creates the preview Worker."
              exit 0
            fi
            exit 1
          fi
          echo "$out"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler uploaded the version but returned no preview URL. Check preview_urls in env.preview of wrangler.jsonc."
            exit 1
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # A fresh runner that runs no PR code, so the PR's build can't reach this job's write token.
  preview-comment:
    needs: preview
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment the link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ needs.preview.outputs.url }}
        run: |
          # The URL came out of PR code, so only a preview address of this PR gets posted.
          if ! [[ "$URL" =~ ^https://pr-${PR}-shop-preview\.[a-z0-9-]+\.workers\.dev$ ]]; then
            echo "::error::Not a preview URL of this PR, so it was not posted: $URL"
            exit 1
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview: $URL"

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check deploy keys
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment (Settings > Environments > production), then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/deploy.mjs --check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SENDCLOUD_PUBLIC_KEY: ${{ secrets.SENDCLOUD_PUBLIC_KEY }}
          SENDCLOUD_SECRET_KEY: ${{ secrets.SENDCLOUD_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # After the live deploy, so a failure here leaves the live site up.
      - name: Update the PR preview Worker
        run: node scripts/deploy.mjs --preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
