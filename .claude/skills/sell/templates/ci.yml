# Goes to .github/workflows/ci.yml. Verify on every PR and on main; it holds no keys.
# Deploys and previews come from Cloudflare Workers Builds (publish skill): main goes live,
# every other branch gets a Worker Preview linked on the PR.
# Branch builds run with the same deploy token as main (publish skill, "The tradeoff, decided"):
# turn them off (Worker > Settings > Build) before a live payment key goes in, and merge only
# when this verify job is green, because a red verify doesn't stop Cloudflare's deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Stripe's official API mock: the e2e tests create real Checkout Sessions against it.
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    env:
      STRIPE_MOCK: http://127.0.0.1:12111
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
