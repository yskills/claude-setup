# Goes to .github/workflows/ci.yml. Verify on every PR, upload a preview link per PR, deploy
# from main only. The shop's keys are secrets of the GitHub environment "production", whose
# deployment-branch rule allows main only, so no PR branch can read them (keys.md). The
# environment "preview" holds only CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-run a deploy from main, e.g. after adding or swapping a key.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a running deploy on main; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Stripe's official API mock: the e2e tests create real Checkout Sessions against it.
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    env:
      STRIPE_MOCK: http://127.0.0.1:12111
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  # A preview link on every PR, so yskills can click through before merging. Previews are
  # versions of a separate Worker, <name>-preview (env.preview in wrangler.jsonc), which the
  # main deploy keeps up to date. It has its own empty D1 and no shop keys, and the "preview"
  # environment's token is limited to that one Worker, so PR code never reaches live data.
  # Old pr-<n> aliases stay up after a PR closes; with no data and no keys behind them that is
  # harmless, and the next main deploy replaces the Worker they point at. wrangler.jsonc:
  #   "env": { "preview": { "name": "shop-preview", "preview_urls": true, "vars": { "SITE_URL": "" },
  #     "d1_databases": [{ "binding": "DB", "database_name": "shop-preview", "database_id": "",
  #       "migrations_dir": "server/migrations" }] } }
  preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Upload preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(npx wrangler versions upload --env preview --preview-alias "pr-$PR" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" | head -1)
          if [ -z "$url" ]; then echo "::error::No preview URL in wrangler's output. Is preview_urls on in env.preview?"; exit 1; fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview: $url"

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check deploy keys
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment (Settings > Environments > production), then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/deploy.mjs --check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SENDCLOUD_PUBLIC_KEY: ${{ secrets.SENDCLOUD_PUBLIC_KEY }}
          SENDCLOUD_SECRET_KEY: ${{ secrets.SENDCLOUD_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
